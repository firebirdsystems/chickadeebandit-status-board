<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Who's Home</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--hub-bg, #f9fafb);
      --surface: var(--hub-surface, #ffffff);
      --border: var(--hub-border, #e5e7eb);
      --border-mid: var(--hub-border, #d1d5db);
      --text: var(--hub-text, #000000);
      --muted: var(--hub-text-muted, #6b7280);
      --accent: var(--hub-primary, #111827);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-fg: var(--hub-primary-fg, #ffffff);
      --radius: var(--hub-radius, 8px);
      --red: var(--hub-tint-danger-fg, #b91c1c);
      --red-soft: var(--hub-tint-danger, #fee2e2);
      --home: var(--hub-tint-success-fg, #16a34a);
      --home-soft: var(--hub-tint-success, #dcfce7);
      --away: var(--hub-tint-warning-fg, #d97706);
      --away-soft: var(--hub-tint-warning, #fef3c7);
      --busy: var(--hub-tint-accent-fg, #7c3aed);
      --busy-soft: var(--hub-tint-accent, #ede9fe);
      --dnd: var(--hub-tint-danger-fg, #b91c1c);
      --dnd-soft: var(--hub-tint-danger, #fee2e2);
      --shadow: 0 1px 3px rgba(15, 23, 42, .07);
    }
    body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--hub-font-size, 15px); line-height: 1.5;
    }
    .app { max-width: 680px; margin: 0 auto; padding: 16px; }
    .topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
    h1 { font-size: 1.35rem; line-height: 1.2; }
    .muted { color: var(--muted); }
    .tiny { font-size: .78rem; }
    .summary { color: var(--muted); font-size: .82rem; margin-bottom: 14px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px;
    }
    /* Set-my-status panel */
    .setter { margin-bottom: 16px; }
    .setter h2 { font-size: .95rem; margin-bottom: 10px; }
    .status-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .status-btn {
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      border: 1.5px solid var(--border-mid); background: var(--surface); color: var(--text);
      border-radius: 999px; padding: 7px 13px; font: inherit; font-size: .85rem; font-weight: 700;
    }
    .status-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
    .setter-extra { display: grid; gap: 10px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field { display: grid; gap: 4px; }
    label { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
    input {
      width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px;
      padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text);
    }
    input:focus { outline: none; border-color: var(--accent); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid transparent; border-radius: 8px; padding: 9px 14px;
      font: inherit; font-size: .88rem; font-weight: 700; cursor: pointer;
      min-height: 40px; background: var(--accent); color: var(--accent-fg);
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .48; cursor: default; }
    .btn-quiet { background: transparent; color: var(--text); border-color: var(--border-mid); }
    .btn-quiet:hover { background: var(--bg); }
    .still-away { display: grid; gap: 10px; margin-bottom: 10px; font-size: .9rem; }
    .still-away-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    /* Board */
    .board { display: grid; gap: 10px; }
    .tile { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%; flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: #fff; font-size: 1rem;
    }
    .tile-main { flex: 1 1 auto; min-width: 0; }
    .tile-name { font-weight: 700; }
    .tile-sub { color: var(--muted); font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pill {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px;
      border-radius: 999px; padding: 4px 10px; font-size: .78rem; font-weight: 800;
    }
    .pill.home { background: var(--home-soft); color: var(--home); }
    .pill.away { background: var(--away-soft); color: var(--away); }
    .pill.busy { background: var(--busy-soft); color: var(--busy); }
    .pill.dnd  { background: var(--dnd-soft);  color: var(--dnd); }
    .me-badge { font-size: .68rem; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
    .empty, .loading { color: var(--muted); text-align: center; padding: 28px 16px; }
    .error { background: var(--red-soft); color: var(--red); padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: .86rem; }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
  </style>
  <base href="/run/status-board/">
</head>
<body>
<div class="app">
  <div id="root" class="loading">Loading…</div>
</div>

<script type="module">
import { esc, hubToday, hubTimeZone, glyph } from "/hub-sdk.js";
import {
  STATUSES, statusLabel, statusGlyph, isOut, formatTime,
  buildBoard, boardSummary, formatBackBy, storedBackDate, chosenBackDate,
} from "./logic.js";

// --- Hub runtime globals (empty in demo mode) --------------------------------
const CONTEXT = window.__CONTEXT_URL ?? "";
const DB = window.__DB_URL ?? "";
const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;

// --- App state ---------------------------------------------------------------
let members = [];
let currentMember = null;
let statusRows = [];
let presence = [];   // hub-derived home/away (family.presence); a hint, never a write
let error = "";
let loaded = false;      // a load has succeeded at least once
let loadFailed = false;  // the FIRST load failed: nothing is known about the board
// Draft of the setter panel (before Save)
let draft = { status: "home", note: "", back_date: "", back_time: "" };

function nowIso() { return new Date().toISOString(); }

/** HH:MM right now on the household's clock — the clock `back_time` is written
 *  in, and the one hubToday() names the day on. Device clock when the document
 *  carries no zone, the same fallback hubToday() takes. */
function hubClock(now = new Date()) {
  const opts = { hour: "2-digit", minute: "2-digit", hourCycle: "h23" };
  const tz = hubTimeZone();
  if (tz) {
    try {
      return new Intl.DateTimeFormat("en-GB", { ...opts, timeZone: tz }).format(now);
    } catch {
      // Unusable zone — fall through to the device clock.
    }
  }
  return new Intl.DateTimeFormat("en-GB", opts).format(now);
}

function avatarColor(id) {
  let h = 0;
  for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `hsl(${h} 55% 45%)`;
}
function initial(name) { return String(name ?? "?").trim().charAt(0).toUpperCase() || "?"; }

async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const json = await res.json().catch(() => null);
  if (!res.ok || !json || typeof json !== "object" || json.error) throw new Error(json?.error || "Couldn’t reach the hub. Try again.");
  return json;
}

const EVENTS = window.__EVENTS_URL ?? "";

// Put presence transitions on the cross-app bus. Every row this app writes is
// visibility 'everyone' — the board is the whole point — so the member id and
// the status carry no more than the board already shows. The note does not go
// on the bus: it is free text people use for where they actually are.
async function publishEvent(type, subjectId, payload = {}) {
  if (!EVENTS) return;
  try {
    await fetch(EVENTS, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, subject_id: subjectId, payload }),
    });
  } catch {
    // Best-effort: the row is already written, so a failed publish is not fatal.
  }
}

async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex", role: "adult" },
      { id: "demo-2", name: "Jordan", role: "adult" },
      { id: "demo-3", name: "Casey", role: "child" },
    ];
    presence = [];
  } else {
    const res = await fetch(`${CONTEXT}?keys=family.members,family.presence`);
    const ctx = await res.json().catch(() => null);
    if (!res.ok || ctx === null || typeof ctx !== "object" || Array.isArray(ctx)) throw new Error("Couldn’t reach the hub. Try again.");
    // A 200 that names the key in `$errors` is the hub saying it could not read it.
    if (Array.isArray(ctx.$errors) && ctx.$errors.includes("family.members")) throw new Error("Couldn’t reach the hub. Try again.");
    members = ctx["family.members"] ?? [];
    // Empty unless Safe Zones has a home zone and location collection is on —
    // the hub decides, and an empty board simply leaves self-reports alone.
    presence = ctx["family.presence"] ?? [];
  }
  currentMember = HUB_MEMBER ?? members[0] ?? { id: "guest", name: "Guest", role: "adult" };
}

async function loadStatuses() {
  if (!DB) {
    statusRows = [
      { member_id: "demo-2", member_name: "Jordan", status: "away", note: "At the office", back_date: hubToday(), back_time: "18:00", updated_at: nowIso() },
      { member_id: "demo-3", member_name: "Casey", status: "busy", note: "Soccer practice", back_date: "", back_time: "", updated_at: nowIso() },
    ];
    return;
  }
  const { rows } = await db("SELECT * FROM app_status_board__statuses");
  statusRows = rows;
}

/** Seed the setter draft from the member's current row. */
function syncDraftFromMine() {
  const mine = statusRows.find((r) => r.member_id === currentMember?.id);
  draft = {
    status: mine?.status ?? "home",
    note: mine?.note ?? "",
    // Only a date the member picked. A stamped one stays out of the form and
    // is stamped again on save (see storedBackDate).
    back_date: chosenBackDate(mine),
    back_time: mine?.back_time ?? "",
  };
}

async function refresh() {
  error = "";
  try {
    await Promise.all([loadMembers(), loadStatuses()]);
    loaded = true;
    loadFailed = false;
    syncDraftFromMine();
    render();
  } catch (e) {
    // Only a failed first load raises the banner; a failed manual refresh
    // keeps the board already on screen and says so inline.
    if (loaded) error = e.message; else loadFailed = true;
    render();
  }
}

/** One save at a time. The prompt's buttons and the setter's Save all land
 *  here; a second tap before the first upsert returns would read the same
 *  previous status and publish the transition twice. */
let saving = false;

async function saveMyStatus() {
  if (!currentMember || saving) return;
  // Home clears the note and the "back by" fields — you're already back, and
  // the setter hides them, so anything left over would be a stale "at the
  // office" the glance now shows beside Home.
  const status = draft.status;
  const note = status === "home" ? "" : (draft.note ?? "").trim();
  const backTime = status === "home" ? "" : (draft.back_time ?? "").trim();
  // A time with no date is given one, so it can lapse and reach Today. The
  // draft keeps only what the member picked; the stamp is flagged in the row.
  const chosenDate = status === "home" ? "" : (draft.back_date ?? "").trim();
  const { back_date: backDate, back_date_auto: backDateAuto } = storedBackDate(chosenDate, backTime, hubToday(), hubClock());

  const btn = document.getElementById("save-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }

  const row = {
    member_id: currentMember.id,
    member_name: currentMember.name,
    status, note, back_date: backDate, back_time: backTime, back_date_auto: backDateAuto,
    visibility: "everyone", updated_at: nowIso(),
  };
  // Read the previous value before the optimistic update overwrites it — only a
  // real transition goes on the bus. Re-saving "away" with a new note is not a
  // change of state, and a rule watching this should not fire again for it.
  const prevStatus = statusRows.find((r) => r.member_id === row.member_id)?.status ?? null;
  // Taken here, after everything above that could throw and with no await in
  // between: every path out of the try below releases it.
  saving = true;
  try {
    await db(
      `INSERT INTO app_status_board__statuses
         (member_id, member_name, status, note, back_date, back_time, back_date_auto, visibility, updated_at)
       VALUES (?, ?, ?, ?, ?, ?, ?, 'everyone', ?)
       ON CONFLICT(member_id) DO UPDATE SET
         member_name = excluded.member_name,
         status      = excluded.status,
         note        = excluded.note,
         back_date   = excluded.back_date,
         back_time   = excluded.back_time,
         back_date_auto = excluded.back_date_auto,
         updated_at  = excluded.updated_at`,
      [row.member_id, row.member_name, row.status, row.note, row.back_date, row.back_time, row.back_date_auto, row.updated_at]
    );
    // Optimistic local update
    statusRows = [...statusRows.filter((r) => r.member_id !== row.member_id), row];
    draft = { status, note, back_date: chosenDate, back_time: backTime };
    error = "";
  } catch (e) {
    error = e.message;
    saving = false;
    render();
    return;
  }
  // The row is saved and statusRows holds it, so the next save reads the right
  // previous status. The lock ends here, before the publish: that request is
  // best-effort, and a slow one must not hold Save or the prompt's buttons.
  saving = false;
  render();
  if (prevStatus !== status) {
    try {
      await publishEvent("status_board.status_changed", row.member_id, {
        member_id: row.member_id,
        status,
        previous_status: prevStatus ?? "",
        back_date: backDate,
      });
    } catch (e) {
      error = e.message;
      render();
    }
  }
}

/** Shown to the member whose own "back by" has gone past. Nobody else can
 *  change their row, so the one person who can is asked. */
function renderStillAway(mine) {
  const row = statusRows.find((r) => r.member_id === mine.memberId);
  return `
    <section class="card still-away">
      <div><strong>Still ${esc(statusLabel(mine.status).toLowerCase())}?</strong> You ${esc(formatBackBy(row?.back_date, row?.back_time, hubToday(), hubClock()).replace(/^was /, "were "))}.</div>
      <div class="still-away-btns">
        <button class="btn" type="button" data-still-away="home">I'm home</button>
        <button class="btn btn-quiet" type="button" data-still-away="out">Still ${esc(statusLabel(mine.status).toLowerCase())}</button>
      </div>
    </section>`;
}

/** Answers the prompt above, from the saved row alone: "home" sets Home; "out"
 *  keeps the saved status and note and drops the lapsed "back by". Anything
 *  half-typed in the setter below is discarded — the prompt asks about the
 *  status on the board, and answering it saves exactly what its button says. */
function answerStillAway(answer) {
  if (saving) return;
  syncDraftFromMine();
  if (answer === "home") draft.status = "home";
  draft.back_date = "";
  draft.back_time = "";
  saveMyStatus();
}

function renderSetter() {
  const showExtra = isOut(draft.status);
  const btns = STATUSES.map((s) => `
    <button type="button" class="status-btn" data-status="${s}" aria-pressed="${draft.status === s}">
      ${glyph(statusGlyph(s), { accent: "currentColor" })} ${esc(statusLabel(s))}
    </button>`).join("");
  return `
    <section class="card setter">
      <h2>Set my status${currentMember ? ` — ${esc(currentMember.name)}` : ""}</h2>
      <div class="status-btns">${btns}</div>
      ${showExtra ? `
        <div class="setter-extra">
          <div class="field">
            <label for="note">Note (optional)</label>
            <input id="note" placeholder="e.g. at the office, back for dinner" value="${esc(draft.note)}" maxlength="120" />
          </div>
          <div class="row2">
            <div class="field">
              <label for="back-date">Back date (optional)</label>
              <input id="back-date" type="date" value="${esc(draft.back_date)}" />
            </div>
            <div class="field">
              <label for="back-time">Back time (optional)</label>
              <input id="back-time" type="time" value="${esc(draft.back_time)}" />
            </div>
          </div>
        </div>` : ""}
      <div style="margin-top:12px"><button class="btn" id="save-btn" type="button"${saving ? " disabled" : ""}>${saving ? "Saving…" : "Save"}</button></div>
    </section>`;
}

function renderTile(row) {
  const sub = [];
  if (row.note) sub.push(esc(row.note));
  if (row.backBy) sub.push(esc(row.backBy));
  // Never let a geofence pass as something the member typed.
  if (row.fromPhone) sub.push("by phone");
  if (row.presenceHint) sub.push(esc(row.presenceHint));
  const isMe = row.memberId === currentMember?.id;
  return `
    <article class="card tile">
      <div class="avatar" style="background:${avatarColor(row.memberId)}">${esc(initial(row.name))}</div>
      <div class="tile-main">
        <div class="tile-name">${esc(row.name)} ${isMe ? '<span class="me-badge">you</span>' : ""}</div>
        ${sub.length ? `<div class="tile-sub">${sub.join(" · ")}</div>` : ""}
      </div>
      <span class="pill ${row.status}">${glyph(statusGlyph(row.status), { accent: "currentColor" })} ${esc(statusLabel(row.status))}</span>
    </article>`;
}

function render() {
  const board = buildBoard(members, statusRows, hubToday(), presence, hubClock());
  const summary = boardSummary(board);
  const mine = board.find((b) => b.memberId === currentMember?.id);
  const root = document.getElementById("root");
  root.className = "app";
  // Unread statuses would draw everyone as Home, and the setter would save
  // over a status it never saw — so a failed first load shows the banner alone.
  if (loadFailed) {
    root.innerHTML = `
      <div class="topbar"><h1>${glyph("house")} Who's Home</h1></div>
      <div class="load-error" data-testid="load-error" role="alert"><span>Couldn’t load the status board.</span> <button type="button" class="load-error-retry" data-testid="load-retry">Try again</button></div>`;
    return;
  }
  root.innerHTML = `
    <div class="topbar">
      <h1>${glyph("house")} Who's Home</h1>
      <button class="btn" style="min-height:32px;padding:5px 12px;font-size:.8rem" type="button" data-refresh>Refresh</button>
    </div>
    <div class="summary">${summary.home} home · ${summary.out} out</div>
    ${error ? `<div class="error">${esc(error)}</div>` : ""}
    ${mine?.overdue ? renderStillAway(mine) : ""}
    ${currentMember ? renderSetter() : ""}
    <section class="board">
      ${board.length ? board.map(renderTile).join("") : `<div class="card empty">No members yet.</div>`}
    </section>`;
}

// --- Events ------------------------------------------------------------------
document.addEventListener("click", (event) => {
  const statusBtn = event.target.closest("[data-status]");
  if (statusBtn) { draft.status = statusBtn.getAttribute("data-status"); render(); return; }
  if (event.target.closest('[data-refresh], [data-testid="load-retry"]')) { refresh(); return; }
  const stillAway = event.target.closest("[data-still-away]");
  if (stillAway) { answerStillAway(stillAway.getAttribute("data-still-away")); return; }
  if (event.target.closest("#save-btn")) { saveMyStatus(); return; }
});

document.addEventListener("input", (event) => {
  const t = event.target;
  if (t.id === "note") draft.note = t.value;
  else if (t.id === "back-date") draft.back_date = t.value;
  else if (t.id === "back-time") draft.back_time = t.value;
});

refresh();
</script>
</body>
</html>
